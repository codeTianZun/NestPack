name: Release 1.0.0

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/release-notes/v1.0.0.md
  push:
    tags: [v1.0.0]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install GUI and build dependencies
        run: python -m pip install -r requirements.txt "PySide6==6.11.2" pyinstaller
      - name: Build Windows GUI and CLI
        run: python scripts/build.py --no-kill
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: dist/NestPack.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: dist/nestpack-cli.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install build dependency
        run: python -m pip install pyinstaller
      - name: Build Linux CLI executable
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist/nestpack-linux-cli
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/tags/v1.0.0'
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum NestPack.exe nestpack-cli.exe nestpack-linux-cli > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 release-assets/NestPack.exe release-assets/nestpack-cli.exe release-assets/nestpack-linux-cli release-assets/SHA256SUMS --verify-tag --title 'NestPack 1.0.0' --notes-file .github/release-notes/v1.0.0.md
